<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic metadata for browser rendering -->
  <meta charset="UTF-8" />
  <title>Requirement Intelligence Agent</title>

  <!-- Tailwind CSS CDN for styling -->
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
</head>

<body class="bg-gray-900 text-white">

  <!-- Main container -->
  <div class="container mx-auto px-8 py-8">

    <!-- Page title -->
    <h1 class="text-3xl font-bold mb-6">
      Requirement Intelligence Agent
    </h1>

    <!-- ================= TEXT ANALYZER ================= -->
    <!-- Section for analyzing plain text input -->
    <div class="bg-gray-800 p-5 rounded-lg mb-6">
      <h2 class="text-xl font-semibold mb-3">
        Paste Requirement Document Text
      </h2>

      <!-- Form to submit text input -->
      <form id="textForm">
        <!-- Textarea for user to paste requirement text -->
        <textarea
          name="text"
          rows="10"
          class="w-full p-3 rounded bg-gray-700 border border-gray-600"
          placeholder="Paste requirement text here..."
        ></textarea>

        <!-- Submit button for text analysis -->
        <button
          type="submit"
          class="mt-3 px-4 py-2 bg-yellow-400 text-black font-bold rounded"
        >
          Analyze Text
        </button>
      </form>
    </div>

    <!-- ================= PDF ANALYZER ================= -->
    <!-- Section for uploading and analyzing PDF documents -->
    <div class="bg-gray-800 p-5 rounded-lg mb-6">
      <h2 class="text-xl font-semibold mb-3">
        Upload PDF Requirement Document
      </h2>

      <!-- Form for PDF file upload -->
      <form id="pdfForm" enctype="multipart/form-data">

        <!-- File input restricted to PDF -->
        <input
          type="file"
          name="file"
          accept="application/pdf"
          class="text-white"
        />

        <!-- Submit button for PDF analysis -->
        <button
          type="submit"
          class="ml-3 px-4 py-2 bg-yellow-400 text-black font-bold rounded"
        >
          Analyze PDF
        </button>
      </form>
    </div>

    <!-- ================= RESULT PANEL ================= -->
    <!-- Displays API response -->
    <div class="bg-gray-800 p-5 rounded-lg">
      <h2 class="text-xl font-semibold mb-3">Analysis Result</h2>

      <!-- Output box to show JSON response -->
      <pre
        id="resultBox"
        class="bg-black text-green-400 p-4 rounded overflow-auto"
        style="min-height: 160px"
      >Waiting for input...</pre>
    </div>
  </div>

  <!-- ================= CLIENT JS ================= -->
  <script>

    // Function to handle API response and display it
    async function handleResponse(res) {
      const box = document.getElementById("resultBox");

      try {
        // Parse JSON response from backend
        const data = await res.json();

        // Format and display JSON in readable format
        box.textContent = JSON.stringify(data, null, 2);
      } catch {
        // Handle cases where response is not valid JSON
        box.textContent = "Server returned no JSON / crashed";
      }
    }

    // TEXT SUBMIT
    // Handles submission of text input form
    document.getElementById("textForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Collect form data (text input)
      const formData = new FormData(e.target);

      // Send POST request to backend API
      const res = await fetch("/api/ui/analyze-text", {
        method: "POST",
        body: formData
      });

      // Process response
      await handleResponse(res);
    });

    // PDF SUBMIT
    // Handles submission of PDF upload form
    document.getElementById("pdfForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Collect file data
      const formData = new FormData(e.target);

      // Send PDF to backend API
      const res = await fetch("/api/ui/analyze-pdf", {
        method: "POST",
        body: formData
      });

      // Process response
      await handleResponse(res);
    });
  </script>

</body>
</html>
